<!DOCTYPE html>

async function hash(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str + 'digiflazz_salt'));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function md5(string) {
  // MD5 sederhana untuk generate sign Digiflazz
  function rotateLeft(lValue, iShiftBits) {
    return (lValue << iShiftBits) | (lValue >>> (32 - iShiftBits));
  }
  function addUnsigned(lX, lY) {
    var lX4, lY4, lX8, lY8, lResult;
    lX8 = (lX & 0x80000000);
    lY8 = (lY & 0x80000000);
    lX4 = (lX & 0x40000000);
    lY4 = (lY & 0x40000000);
    lResult = (lX & 0x3FFFFFFF) + (lY & 0x3FFFFFFF);
    if (lX4 & lY4) return (lResult ^ 0x80000000 ^ lX8 ^ lY8);
    if (lX4 | lY4) {
      if (lResult & 0x40000000) return (lResult ^ 0xC0000000 ^ lX8 ^ lY8);
      else return (lResult ^ 0x40000000 ^ lX8 ^ lY8);
    } else {
      return (lResult ^ lX8 ^ lY8);
    }
  }
  function f(x, y, z) { return (x & y) | ((~x) & z); }
  function g(x, y, z) { return (x & z) | (y & (~z)); }
  function h(x, y, z) { return (x ^ y ^ z); }
  function i(x, y, z) { return (y ^ (x | (~z))); }
  function ff(a, b, c, d, x, s, ac) {
    a = addUnsigned(a, addUnsigned(addUnsigned(f(b, c, d), x), ac));
    return addUnsigned(rotateLeft(a, s), b);
  }
  function gg(a, b, c, d, x, s, ac) {
    a = addUnsigned(a, addUnsigned(addUnsigned(g(b, c, d), x), ac));
    return addUnsigned(rotateLeft(a, s), b);
  }
  function hh(a, b, c, d, x, s, ac) {
    a = addUnsigned(a, addUnsigned(addUnsigned(h(b, c, d), x), ac));
    return addUnsigned(rotateLeft(a, s), b);
  }
  function ii(a, b, c, d, x, s, ac) {
    a = addUnsigned(a, addUnsigned(addUnsigned(i(b, c, d), x), ac));
    return addUnsigned(rotateLeft(a, s), b);
  }
  function convertToWordArray(string) {
    var lWordCount;
    var lMessageLength = string.length;
    var lNumberOfWordsTemp1 = lMessageLength + 8;
    var lNumberOfWordsTemp2 = (lNumberOfWordsTemp1 - (lNumberOfWordsTemp1 % 64)) / 64;
    var lNumberOfWords = (lNumberOfWordsTemp2 + 1) * 16;
    var lWordArray = new Array(lNumberOfWords - 1);
    var lBytePosition = 0;
    var lByteCount = 0;
    while (lByteCount < lMessageLength) {
      lWordCount = (lByteCount - (lByteCount % 4)) / 4;
      lBytePosition = (lByteCount % 4) * 8;
      lWordArray[lWordCount] = (lWordArray[lWordCount] | (string.charCodeAt(lByteCount) << lBytePosition));
      lByteCount++;
    }
    lWordCount = (lByteCount - (lByteCount % 4)) / 4;
    lBytePosition = (lByteCount % 4) * 8;
    lWordArray[lWordCount] = lWordArray[lWordCount] | (0x80 << lBytePosition);
    lWordArray[lNumberOfWords - 2] = lMessageLength << 3;
    lWordArray[lNumberOfWords - 1] = lMessageLength >>> 29;
    return lWordArray;
  }
  function wordToHex(lValue) {
    var wordToHexValue = "", wordToHexValueTemp = "", lByte, lCount;
    for (lCount = 0; lCount <= 3; lCount++) {
      lByte = (lValue >>> (lCount * 8)) & 255;
      wordToHexValueTemp = "0" + lByte.toString(16);
      wordToHexValue = wordToHexValue + wordToHexValueTemp.substr(wordToHexValueTemp.length - 2, 2);
    }
    return wordToHexValue;
  }
  function utf8Encode(string) {
    string = string.replace(/\r\n/g, "\n");
    var utftext = "";
    for (var n = 0; n < string.length; n++) {
      var c = string.charCodeAt(n);
      if (c < 128) {
        utftext += String.fromCharCode(c);
      } else if ((c > 127) && (c < 2048)) {
        utftext += String.fromCharCode((c >> 6) | 192);
        utftext += String.fromCharCode((c & 63) | 128);
      } else {
        utftext += String.fromCharCode((c >> 12) | 224);
        utftext += String.fromCharCode(((c >> 6) & 63) | 128);
        utftext += String.fromCharCode((c & 63) | 128);
      }
    }
    return utftext;

  var S41 = 6, S42 = 10, S43 = 15, S44 = 21;
  string = utf8Encode(string);
  x = convertToWordArray(string);
  a = 0x67452301; b = 0xEFCDAB89; c = 0x98BADCFE; d = 0x10325476;
  for (k = 0; k < x.length; k += 16) {
    AA = a; BB = b; CC = c; DD = d;
    a = ff(a, b, c, d, x[k + 0], S11, 0xD76AA478);
    d = ff(d, a, b, c, x[k + 1], S12, 0xE8C7B756);
    c = ff(c, d, a, b, x[k + 2], S13, 0x242070DB);
    b = ff(b, c, d, a, x[k + 3], S14, 0xC1BDCEEE);
    a = ff(a, b, c, d, x[k + 4], S11, 0xF57C0FAF);
    d = ff(d, a, b, c, x[k + 5], S12, 0x4787C62A);
    c = ff(c, d, a, b, x[k + 6], S13, 0xA8304613);
    b = ff(b, c, d, a, x[k + 7], S14, 0xFD469501);
    a = ff(a, b, c, d, x[k + 8], S11, 0x698098D8);
    d = ff(d, a, b, c, x[k + 9], S12, 0x8B44F7AF);
    c = ff(c, d, a, b, x[k + 10], S13, 0xFFFF5BB1);
    b = ff(b, c, d, a, x[k + 11], S14, 0x895CD7BE);
    a = ff(a, b, c, d, x[k + 12], S11, 0x6B901122);
    d = ff(d, a, b, c, x[k + 13], S12, 0xFD987193);
    c = ff(c, d, a, b, x[k + 14], S13, 0xA679438E);
    b = ff(b, c, d, a, x[k + 15], S14, 0x49B40821);
    a = gg(a, b, c, d, x[k + 1], S21, 0xF61E2562);
    d = gg(d, a, b, c, x[k + 6], S22, 0xC040B340);
    c = gg(c, d, a, b, x[k + 11], S23, 0x265E5A51);
    b = gg(b, c, d, a, x[k + 0], S24, 0xE9B6C7AA);
    a = gg(a, b, c, d, x[k + 5], S21, 0xD62F105D);
    d = gg(d, a, b, c, x[k + 10], S22, 0x2441453);
    c = gg(c, d, a, b, x[k + 15], S23, 0xD8A1E681);
    b = gg(b, c, d, a, x[k + 4], S24, 0xE7D3FBC8);
    a = gg(a, b, c, d, x[k + 9], S21, 0x21E1CDE6);
    d = gg(d, a, b, c, x[k + 14], S22, 0xC33707D6);
    c = gg(c, d, a, b, x[k + 3], S23, 0xF4D50D87);
    b = gg(b, c, d, a, x[k + 8], S24, 0x455A14ED);
    a = gg(a, b, c, d, x[k + 13], S21, 0xA9E3E905);
    d = gg(d, a, b, c, x[k + 2], S22, 0xFCEFA3F8);
    c = gg(c, d, a, b, x[k + 7], S23, 0x676F02D9);
    b = gg(b, c, d, a, x[k + 12], S24, 0x8D2A4C8A);
    a = hh(a, b, c, d, x[k + 5], S31, 0xFFFA3942);
    d = hh(d, a, b, c, x[k + 8], S32, 0x8771F681);
    c = hh(c, d, a, b, x[k + 11], S33, 0x6D9D6122);
    b = hh(b, c, d, a, x[k + 14], S34, 0xFDE5380C);
    a = hh(a, b, c, d, x[k + 1], S31, 0xA4BEEA44);
    d = hh(d, a, b, c, x[k + 4], S32, 0x4BDECFA9);
    c = hh(c, d, a, b, x[k + 7], S33, 0xF6BB4B60);
    b = hh(b, c, d, a, x[k + 10], S34, 0xBEBFBC70);
    a = hh(a, b, c, d, x[k + 13], S31, 0x289B7EC6);
    d = hh(d, a, b, c, x[k + 0], S32, 0xEAA127FA);
    c = hh(c, d, a, b, x[k + 3], S33, 0xD4EF3085);
    b = hh(b, c, d, a, x[k + 6], S34, 0x4881D05);
    a = hh(a, b, c, d, x[k + 9], S31, 0xD9D4D039);
    d = hh(d, a, b, c, x[k + 12], S32, 0xE6DB99E5);
    c = hh(c, d, a, b, x[k + 15], S33, 0x1FA27CF8);
    b = hh(b, c, d, a, x[k + 2], S34, 0xC4AC5665);
    a = ii(a, b, c, d, x[k + 0], S41, 0xF4292244);
    d = ii(d, a, b, c, x[k + 7], S42, 0x432AFF97);
    c = ii(c, d, a, b, x[k + 14], S43, 0xAB9423A7);
    b = ii(b, c, d, a, x[k + 5], S44, 0xFC93A039);
    a = ii(a, b, c, d, x[k + 12], S41, 0x655B59C3);
    d = ii(d, a, b, c, x[k + 3], S42, 0x8F0CCC92);
    c = ii(c, d, a, b, x[k + 10], S43, 0xFFEFF47D);
    b = ii(b, c, d, a, x[k + 1], S44, 0x85845DD1);
    a = ii(a, b, c, d, x[k + 8], S41, 0x6FA87E4F);
    d = ii(d, a, b, c, x[k + 15], S42, 0xFE2CE6E0);
    c = ii(c, d, a, b, x[k + 6], S43, 0xA3014314);
    b = ii(b, c, d, a, x[k + 13], S44, 0x4E0811A1);
    a = ii(a, b, c, d, x[k + 4], S41, 0xF7537E82);
    d = ii(d, a, b, c, x[k + 11], S42, 0xBD3AF235);
    c = ii(c, d, a, b, x[k + 2], S43, 0x2AD7D2BB);
    b = ii(b, c, d, a, x[k + 9], S44, 0xEB86D391);
    a = addUnsigned(a, AA);
    b = addUnsigned(b, BB);
    c = addUnsigned(c, CC);
    d = addUnsigned(d, DD);
  }
  var tempValue = wordToHex(a) + wordToHex(b) + wordToHex(c) + wordToHex(d);
  return tempValue.toLowerCase();
}

function formatRp(n) { return 'Rp ' + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function showLoading(show) { document.getElementById('loading').classList.toggle('active', show); }
function closePinModal() {
  document.getElementById('pinModal').classList.remove('active');
  document.getElementById('pinInput').value = '';
  document.getElementById('pinError').textContent = '';
}

// ============================================
// VERIFIKASI SESSION
// ============================================
async function verifySession() {
  const sid = localStorage.getItem('df_session');
  const user = localStorage.getItem('df_user');
  if (!sid || !user) { window.location.href = 'index.html'; return false; }

  try {
    const s = await db.collection('sessions').doc(sid).get();
    if (!s.exists || !s.data().active || s.data().expiresAt.toDate() < new Date()) {
      logout(); return false;
    }
    currentUser = user;
    document.getElementById('welcomeText').textContent = 'Selamat datang, ' + user;
    return true;
  } catch(e) { logout(); return false; }
}

// ============================================
// LOAD PRODUK DARI FIRESTORE
// ============================================
async function initProducts() {
  const select = document.getElementById('productSelect');

  try {
    const snap = await db.collection('products').get();

    // Jika belum ada produk, tambahkan default (Smartfren 5.000)
    if (snap.empty) {
      await db.collection('products').doc('smartfren_5k').set({
        sku: 'SM5',
        buyer_sku_code: 'S5',        // SKU Digiflazz asli
        name: 'Smartfren 5.000',
        price: 6000,
        category: 'pulsa',
        provider: 'Smartfren',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      return initProducts();
    }

    snap.forEach(doc => {
      const p = doc.data();
      const opt = document.createElement('option');
      opt.value = doc.id;
      opt.textContent = `${p.sku} — ${p.name} (${formatRp(p.price)})`;
      opt.dataset.sku = p.sku;
      opt.dataset.buyerSkuCode = p.buyer_sku_code || p.sku;
      opt.dataset.name = p.name;
      opt.dataset.price = p.price;
      select.appendChild(opt);
    });

  } catch(e) {
    console.error('Produk error:', e);
    document.getElementById('purchaseError').textContent = 'Gagal memuat produk';
  }
}

function updateInfo() {
  const sel = document.getElementById('productSelect');
  const opt = sel.options[sel.selectedIndex];
  if (!opt.value) {
    document.getElementById('productInfo').classList.add('hidden');
    selectedProduct = null; return;
  }
  selectedProduct = {
    id: opt.value,
    sku: opt.dataset.sku,
    buyerSkuCode: opt.dataset.buyerSkuCode,
    name: opt.dataset.name,
    price: parseInt(opt.dataset.price)
  };
  document.getElementById('infoSku').textContent = selectedProduct.sku;
  document.getElementById('infoName').textContent = selectedProduct.name;
  document.getElementById('infoPrice').textContent = formatRp(selectedProduct.price);
  document.getElementById('productInfo').classList.remove('hidden');
}

// ============================================
// SALDO REALTIME
// ============================================
function setupSaldo() {
  db.collection('users').doc(currentUser).onSnapshot(doc => {
    if (doc.exists) {
      currentSaldo = doc.data().saldo || 0;
      document.getElementById('saldoDisplay').textContent = formatRp(currentSaldo);
    }
  });
}

// ============================================
// API DIGIFLAZZ — PEMBELIAN LANGSUNG
// ============================================
async function buyFromDigiflazz(buyerSkuCode, customerNo, refId) {
  // Generate sign: md5(username + apiKey + ref_id)
  const signString = DIGIFLAZZ_CONFIG.username + DIGIFLAZZ_CONFIG.apiKey + refId;
  const sign = md5(signString);
  
  const payload = {
    username: DIGIFLAZZ_CONFIG.username,
    buyer_sku_code: buyerSkuCode,
    customer_no: customerNo,
    ref_id: refId,
    sign: sign
  };
  
  console.log  console.log('Request to Digiflazz:', payload);
  
  try {
    const response = await fetch(DIGIFLAZZ_CONFIG.apiUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify(payload)
    });
    
    const data = await response.json();
    console.log('Response from Digiflazz:', data);
    return data;
    
  } catch (error) {
    console.error('API Error:', error);
    throw new Error('Gagal terhubung ke server Digiflazz: ' + error.message);
  }
}

// ============================================
// PEMBELIAN LENGKAP DENGAN API DIGIFLAZZ
// ============================================
function preparePurchase() {
  const num = document.getElementById('customerNo').value.trim();
  const err = document.getElementById('purchaseError');

  if (!num || num.length < 10) { err.textContent = 'Nomor HP tidak valid!'; return; }
  if (!selectedProduct) { err.textContent = 'Pilih produk terlebih dahulu!'; return; }
  if (currentSaldo < selectedProduct.price) { err.textContent = 'Saldo tidak mencukupi!'; return; }

  err.textContent = '';
  document.getElementById('pinModal').classList.add('active');
  document.getElementById('pinInput').focus();
}

async function processPurchase() {
  const pin = document.getElementById('pinInput').value;
  const err = document.getElementById('pinError');
  const num = document.getElementById('customerNo').value.trim();

  if (!/^\d{6}$/.test(pin)) { err.textContent = 'PIN harus 6 digit!'; return; }

  showLoading(true);
  
  try {
    // 1. Verifikasi PIN dari database
    const userDoc = await db.collection('users').doc(currentUser).get();
    if (userDoc.data().pin !== await hash(pin)) {
      err.textContent = 'PIN salah!'; showLoading(false); return;
    }

    // 2. Cek saldo cukup
    if (currentSaldo < selectedProduct.price) {
      err.textContent = 'Saldo tidak mencukupi!'; showLoading(false); return;
    }

    // 3. Generate Ref ID unik
    const refId = 'TRX' + Date.now();

    // 4. KIRIM KE API DIGIFLAZZ
    const apiResult = await buyFromDigiflazz(selectedProduct.buyerSkuCode, num, refId);
    
    // 5. Cek response dari Digiflazz
    if (apiResult.status === 'error' || !apiResult.data) {
      throw new Error(apiResult.message || 'Gagal terhubung ke Digiflazz');
    }

    const apiData = apiResult.data;
    const digiStatus = apiData.status;  // "Pending", "Sukses", atau "Gagal"
    const digiMessage = apiData.message || '';

    // 6. Jika status Gagal, jangan kurangi saldo
    if (digiStatus === 'Gagal') {
      err.textContent = 'Transaksi Digiflazz gagal: ' + digiMessage;
      showLoading(false);
      
      // Simpan transaksi gagal ke history
      await db.collection('transactions').doc(refId).set({
        transactionId: refId,
        username: currentUser,
        productId: selectedProduct.id,
        sku: selectedProduct.sku,
        productName: selectedProduct.name,
        price: selectedProduct.price,
        targetNumber: num,
        digiflazzStatus: digiStatus,
        digiflazzMessage: digiMessage,
        status: 'failed',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      
      loadHistory();
      return;
    }

    // 7. Jika Sukses atau Pending, kurangi saldo & simpan transaksi
    const batch = db.batch();

    batch.update(db.collection('users').doc(currentUser), {
      saldo: currentSaldo - selectedProduct.price,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    batch.set(db.collection('transactions').doc(refId), {
      transactionId: refId,
      username: currentUser,
      productId: selectedProduct.id,
      sku: selectedProduct.sku,
      productName: selectedProduct.name,
      price: selectedProduct.price,
      targetNumber: num,
      digiflazzStatus: digiStatus,
      digiflazzMessage: digiMessage,
      sn: apiData.sn || null,
      refId: refId,
      status: digiStatus === 'Sukses' ? 'success' : 'pending',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    await batch.commit();

    // 8. Tutup modal & reset
    closePinModal();
    showLoading(false);

    document.getElementById('customerNo').value = '';
    document.getElementById('productSelect').selectedIndex = 0;
    document.getElementById('productInfo').classList.add('hidden');

    // Tampilkan hasil
    let msg = `✅ Pembelian ${digiStatus}!\n\n`;
    msg += `Produk: ${selectedProduct.name}\n`;
    msg += `Nomor: ${num}\n`;
    msg += `Harga: ${formatRp(selectedProduct.price)}\n`;
    if (apiData.sn) msg += `SN: ${apiData.sn}\n`;
    msg += `Pesan: ${digiMessage}`;
    
    alert(msg);
    selectedProduct = null;
    loadHistory();

  } catch(e) {
    console.error('Purchase error:', e);
    err.textContent = 'Error: ' + (e.message || 'Terjadi kesalahan');
    showLoading(false);
  }
}

// ============================================
// RIWAYAT
// ============================================
async function loadHistory() {
  const box = document.getElementById('historyList');
  try {
    const snap = await db.collection('transactions')
      .where('username', '==', currentUser)
      .orderBy('createdAt', 'desc')
      .limit(20)
      .get();

    if (snap.empty) {
      box.innerHTML = '<p style="color:#9ca3af;text-align:center;padding:20px;">Belum ada transaksi</p>';
      return;
    }

    box.innerHTML = '';
    snap.forEach(doc => {
      const t = doc.data();
      const date = t.createdAt ? t.createdAt.toDate().toLocaleString('id-ID') : '-';
      let badgeClass = 'badge-pending';
      let badgeText = 'Pending';
      if (t.status === 'success') { badgeClass = 'badge-success'; badgeText = 'Sukses'; }
      if (t.status === 'failed') { badgeClass = 'badge-failed'; badgeText = 'Gagal'; }
      
      box.innerHTML += `
        <div class="history-item">
          <div class="history-info">
            <h4>${t.productName}</h4>
            <p>${t.targetNumber} • ${date}</p>
          </div>
          <div style="text-align:right;">
            <div class="history-price">${formatRp(t.price)}</div>
            <span class="badge ${badgeClass}">${badgeText}</span>
          </div>
        </div>
      `;
    });
  } catch(e) {
    box.innerHTML = '<p style="color:#ef4444;text-align:center;padding:20px;">Gagal memuat riwayat</p>';
  }
}

// ============================================
// LOGOUT
// ============================================
async function logout() {
  const sid = localStorage.getItem('df_session');
  if (sid) {
    try { await db.collection('sessions').doc(sid).update({ active: false }); } catch(e){}
  }
  localStorage.clear();
  window.location.href = 'index.html';
}

// INIT
// ============================================
(async () => {
  if (!await verifySession()) return;
  await initProducts();
  setupSaldo();
  loadHistory();
})();

// ESC close modal
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePinModal();
});
