<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digiflazz Store — Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .box {
      background: white;
      width: 100%;
      max-width: 400px;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .logo { text-align: center; margin-bottom: 25px; }
    .logo h1 { color: #4f46e5; font-size: 1.8rem; }
    .logo p { color: #64748b; font-size: 0.9rem; margin-top: 5px; }
    h2 { text-align: center; color: #1e293b; margin-bottom: 20px; }
    .input-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; color: #374151; font-size: 0.9rem; font-weight: 500; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #6366f1; }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s;
    }
    button:hover { transform: translateY(-2px); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .switch {
      text-align: center;
      margin-top: 18px;
      color: #6b7280;
      font-size: 0.9rem;
    }
    .switch a { color: #4f46e5; text-decoration: none; font-weight: 600; cursor: pointer; }
    .error { color: #ef4444; font-size: 0.85rem; margin-top: 10px; text-align: center; min-height: 20px; }
    .hidden { display: none !important; }
    .pin-hint { font-size: 0.8rem; color: #9ca3af; margin-top: 4px; }
  </style>
</head>
<body>

<div class="box">
  <div class="logo">
    <h1>⚡ Digiflazz Store</h1>
    <p>Pembelian Pulsa & Data</p>
  </div>

  <!-- LOGIN FORM -->
  <div id="loginForm">
    <h2>Masuk</h2>
    <div class="input-group">
      <label>Username</label>
      <input type="text" id="loginUser" placeholder="Masukkan username">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="Masukkan password">
    </div>
    <button onclick="handleLogin()" id="btnLogin">Masuk</button>
    <div class="error" id="loginError"></div>
    <div class="switch">Belum punya akun? <a onclick="toggleForm('register')">Daftar</a></div>
  </div>

  <!-- REGISTER FORM -->
  <div id="registerForm" class="hidden">
    <h2>Daftar Akun</h2>
    <div class="input-group">
      <label>Username</label>
      <input type="text" id="regUser" placeholder="Buat username">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="regPass" placeholder="Min. 6 karakter">
    </div>
    <div class="input-group">
      <label>Konfirmasi Password</label>
      <input type="password" id="regPass2" placeholder="Ulangi password">
    </div>
    <div class="input-group">
      <label>PIN Keamanan (6 digit)</label>
      <input type="password" id="regPin" placeholder="Contoh: 123456" maxlength="6">
      <div class="pin-hint">PIN wajib untuk setiap checkout</div>
    </div>
    <button onclick="handleRegister()" id="btnRegister">Daftar</button>
    <div class="error" id="regError"></div>
    <div class="switch">Sudah punya akun? <a onclick="toggleForm('login')">Masuk</a></div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
// ============================================
// KONFIGURASI FIREBASE — GANTI DENGAN MILIK ANDA
// ============================================
const firebaseConfig = {
    apiKey: "AIzaSyBs3mbLNCmpJq9QzRCW75WWKxVRNhbnF7g",
    authDomain: "bero-shop.firebaseapp.com",
    projectId: "bero-shop",
    storageBucket: "bero-shop.firebasestorage.app",
    messagingSenderId: "705199135786",
    appId: "1:705199135786:web:ab18c2532882c41c3df753"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ============================================
// UTILITAS
// ============================================
async function hash(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str + 'digiflazz_salt'));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function genId() { return 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2,9); }

// ============================================
// TOGGLE FORM
// ============================================
function toggleForm(type) {
  document.getElementById('loginForm').classList.toggle('hidden', type !== 'login');
  document.getElementById('registerForm').classList.toggle('hidden', type !== 'register');
  document.querySelectorAll('.error').forEach(e => e.textContent = '');
}

// ============================================
// REGISTER — DETEKSI USER SUDAH ADA
// ============================================
async function handleRegister() {
  const user = document.getElementById('regUser').value.trim().toLowerCase();
  const pass = document.getElementById('regPass').value;
  const pass2 = document.getElementById('regPass2').value;
  const pin = document.getElementById('regPin').value;
  const err = document.getElementById('regError');
  const btn = document.getElementById('btnRegister');

  if (!user || !pass || !pin) { err.textContent = 'Semua field wajib diisi!'; return; }
  if (pass !== pass2) { err.textContent = 'Password tidak cocok!'; return; }
  if (pass.length < 6) { err.textContent = 'Password minimal 6 karakter!'; return; }
  if (!/^\d{6}$/.test(pin)) { err.textContent = 'PIN harus 6 digit angka!'; return; }

  btn.disabled = true;
  try {
    const doc = await db.collection('users').doc(user).get();
    if (doc.exists) {
      err.textContent = 'Username sudah terdaftar! Silakan login.';
      btn.disabled = false;
      return;
    }

    await db.collection('users').doc(user).set({
      username: user,
      password: await hash(pass),
      pin: await hash(pin),
      saldo: 0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    const sid = genId();
    const exp = new Date(Date.now() + 24*60*60*1000);
    await db.collection('sessions').doc(sid).set({
      username: user,
      expiresAt: exp,
      active: true
    });
    localStorage.setItem('df_session', sid);
    localStorage.setItem('df_user', user);

    window.location.href = 'dashboard.html';

  } catch (e) {
    err.textContent = 'Error: ' + e.message;
    btn.disabled = false;
  }
}

// ============================================
// LOGIN
// ============================================
async function handleLogin() {
  const user = document.getElementById('loginUser').value.trim().toLowerCase();
  const pass = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');
  const btn = document.getElementById('btnLogin');

  if (!user || !pass) { err.textContent = 'Username & password wajib diisi!'; return; }

  btn.disabled = true;
  try {
    const doc = await db.collection('users').doc(user).get();
    if (!doc.exists) {
      err.textContent = 'Username tidak ditemukan! Silakan daftar.';
      btn.disabled = false;
      return;
    }
    if (doc.data().password !== await hash(pass)) {
      err.textContent = 'Password salah!';
      btn.disabled = false;
      return;
    }

    const sid = genId();
    const exp = new Date(Date.now() + 24*60*60*1000);
    await db.collection('sessions').doc(sid).set({
      username: user,
      expiresAt: exp,
      active: true
    });
    localStorage.setItem('df_session', sid);
    localStorage.setItem('df_user', user);

    window.location.href = 'dashboard.html';

  } catch (e) {
    err.textContent = 'Error: ' + e.message;
    btn.disabled = false;
  }
}

// ============================================
// AUTO CHECK SESSION
// ============================================
(async () => {
  const sid = localStorage.getItem('df_session');
  const user = localStorage.getItem('df_user');
  if (!sid || !user) return;
  try {
    const s = await db.collection('sessions').doc(sid).get();
    if (s.exists && s.data().active && s.data().expiresAt.toDate() > new Date()) {
      window.location.href = 'dashboard.html';
    } else {
      localStorage.clear();
    }
  } catch(e) { localStorage.clear(); }
})();
</script>

</body>
</html>
